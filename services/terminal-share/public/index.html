<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>T-Max · Shared terminal</title><link rel="stylesheet" href="/xterm.css"><link rel="stylesheet" href="/style.css"></head>
<body><header><a href="https://eng.xyznot.com" target="_blank" rel="noopener">T-Max</a><span>Shared terminal</span><span id="status" role="status">Connecting…</span><button id="control" hidden>Take control</button><button id="keyboard" hidden>Keyboard</button><button id="reconnect" hidden>Reconnect</button></header><main id="viewport"><div id="terminal"></div></main><nav id="keys" aria-label="Terminal keys" hidden><button data-key="esc">Esc</button><button data-key="tab">Tab</button><button data-key="interrupt">Ctrl-C</button><button data-key="up" aria-label="Up arrow">↑</button><button data-key="down" aria-label="Down arrow">↓</button><button data-key="left" aria-label="Left arrow">←</button><button data-key="right" aria-label="Right arrow">→</button><button data-key="enter">Enter</button></nav><footer id="note">The terminal stays on its original machine. The owner controls the link’s expiry and can stop sharing at any time.</footer><script type="module" src="/app.js"></script></body></html>
