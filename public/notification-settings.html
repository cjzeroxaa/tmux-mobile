<!doctype html>
<html lang="en">
<head>
  <script>try { var t=JSON.parse(localStorage.getItem("tmux-mobile-theme")||"{}").theme; if(t && t !== "auto") document.documentElement.dataset.theme=t === "kami" ? "kami" : "dark"; } catch {}</script>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Notifications · T-MAX</title><link rel="icon" href="/icon-192.png">
  <link rel="stylesheet" href="/reports.css"><link rel="stylesheet" href="/paper-theme.css?v=1">
  <script type="module" src="/notification-settings.js"></script>
  <style>
    main{max-width:580px;margin:0 auto;padding:36px 24px}h1{margin-bottom:12px}
    .description,.hint{color:var(--muted);font-size:14px}fieldset{border:0;padding:0;margin:24px 0;min-width:0}
    label{display:block;margin-bottom:20px}input:not([type=checkbox]){display:block;width:100%;font:inherit;color:var(--ink);background:var(--paper-surface);border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:6px;min-height:46px}
    .toggle{display:flex;align-items:center;justify-content:space-between;font-size:18px}input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent)}.times{display:flex;gap:16px}.times label{flex:1;min-width:0}
    #save{background:var(--ink);color:var(--bg);width:100%}#status{margin-top:16px}#device-zone{margin-bottom:22px}#schedule:disabled{opacity:.55}
  </style>
</head>
<body>
  <header class="topbar"><a href="/command-center" class="back">← Sessions</a><span>T-MAX</span></header>
  <main>
    <h1>Notifications</h1>
    <p class="description">Quiet hours apply to the shared notification topic for all machines. The server follows this schedule even when the app is closed.</p>
    <p id="permission" class="hint"></p>
    <form id="settings">
      <fieldset id="controls" disabled>
        <label class="toggle" for="enabled">Quiet hours <input id="enabled" type="checkbox"></label>
        <p class="hint">Off means notifications can arrive at any time. Messages muted during quiet hours are not sent later.</p>
        <fieldset id="schedule">
          <div class="times"><label for="start">From <input id="start" type="time" required value="21:00"></label><label for="end">Until <input id="end" type="time" required value="08:00"></label></div>
          <label for="timeZone">Timezone <input id="timeZone" type="text" required list="zones" autocomplete="off" spellcheck="false" value="UTC"></label>
          <datalist id="zones"></datalist>
          <button id="device-zone" type="button">Use device timezone</button>
        </fieldset>
        <button id="save" type="submit">Save</button>
      </fieldset>
    </form>
    <p id="status" role="status" aria-live="polite">Loading…</p>
    <button id="retry" type="button" hidden>Retry</button>
    <a id="login" href="/auth/google/login?returnTo=%2Fnotification-settings.html" hidden>Sign in</a>
  </main>
</body>
</html>
