<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>稿件 · AMUX</title>
    <link rel="icon" href="/icon-192.png" />
    <script>
      try {
        const t = JSON.parse(
          localStorage.getItem("tmux-mobile-theme") || "{}",
        ).theme;
        if (t && t !== "auto")
          document.documentElement.dataset.theme =
            t === "kami" ? "kami" : "dark";
      } catch {}
    </script>
    <link rel="stylesheet" href="/paper-theme.css" />
    <link rel="stylesheet" href="/drafts.css" />
    <script type="module" src="/drafts.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a href="/command-center">← Sessions</a
      ><a href="/drafts" class="brand">AMUX <span>稿件</span></a
      ><button id="refresh" type="button">刷新</button>
    </header>
    <main class="workspace">
      <aside class="library">
        <div class="library-heading">
          <span class="eyebrow">DRAFTS</span>
          <h1>在这里，<br />把想法改清楚。</h1>
          <p id="scope">完整内容、图解和反馈，留在同一页。</p>
        </div>
        <nav id="draftList" aria-label="稿件列表"></nav>
        <details id="createPanel" hidden>
          <summary>新建稿件</summary>
          <form id="createForm">
            <label for="request">让 Agent 做什么？</label
            ><textarea
              id="request"
              required
              maxlength="4000"
              placeholder="例如：解释这个 PR，画出修改前后的数据流。"
            ></textarea
            ><label for="filename">稿件文件名</label
            ><input
              id="filename"
              value="review.html"
              pattern="[a-zA-Z0-9][a-zA-Z0-9_-]{0,79}\.html"
              required
            /><button type="submit">交给这个 Session</button
            ><button id="copyCreate" type="button">复制生成指令</button>
          </form>
        </details>
        <a class="skill-link" href="/skills/tmax-drafts/SKILL.md"
          >生成端 Skill ↗</a
        >
      </aside>
      <section class="document" aria-label="稿件内容">
        <div class="document-toolbar">
          <div>
            <h2 id="title">选择一份稿件</h2>
            <p id="updated"></p>
          </div>
          <div class="document-actions">
            <label for="versions" class="sr-only">版本</label
            ><select id="versions" aria-label="版本" hidden></select
            ><a id="download" hidden>下载 HTML</a
            ><button id="share" hidden>复制链接</button>
          </div>
        </div>
        <p id="status" role="status" aria-live="polite">正在读取…</p>
        <a id="login" hidden>登录后查看</a>
        <div id="empty" hidden>
          <span class="paper-mark" aria-hidden="true">↗</span>
          <h2>从一份完整的解释开始</h2>
          <p>
            Agent 生成 HTML 后会发布到这里。<br />选中你想讨论的文字，就可以留下评论。
          </p>
          <p id="emptyHint">
            从 Session 卡片的稿件按钮进入，可以直接让 Agent 开始。
          </p>
        </div>
        <iframe
          id="canvas"
          title="稿件画布"
          sandbox="allow-scripts"
          referrerpolicy="no-referrer"
          hidden
        ></iframe>
      </section>
      <aside id="feedback" class="feedback" hidden>
        <div class="feedback-heading">
          <span class="eyebrow">FEEDBACK</span>
          <h2>一起改这一稿</h2>
          <p>在画布里选中文字，留下具体意见。</p>
        </div>
        <form id="commentForm">
          <blockquote id="selection">尚未选择文字</blockquote>
          <label for="comment">你的意见</label
          ><textarea
            id="comment"
            maxlength="4000"
            required
            placeholder="这里需要解释得更具体一些…"
          ></textarea
          ><button id="saveComment" type="submit" disabled>添加评论</button>
        </form>
        <div class="review-actions">
          <button id="revise" type="button">让 Agent 按评论修改</button
          ><button id="copyFeedback" type="button">复制反馈</button>
        </div>
        <p id="feedbackStatus" role="status"></p>
        <div id="comments"></div>
      </aside>
    </main>
  </body>
</html>
