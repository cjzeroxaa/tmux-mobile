<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>稿件标题</title><style>
:root{color-scheme:light dark;--bg:#f4eee3;--paper:#fcf8ee;--ink:#293d2e;--line:#d4c7ab;--accent:#264d3d}@media(prefers-color-scheme:dark){:root{--bg:#17231d;--paper:#203128;--ink:#f0eadc;--line:#465246;--accent:#cad9b8}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 "Avenir Next","PingFang SC",sans-serif}main{max-width:960px;margin:auto;padding:clamp(24px,6vw,72px)}h1,h2{font-family:Georgia,"Noto Serif SC",serif;font-weight:400;line-height:1.3}h1{font-size:clamp(30px,4vw,52px);max-width:18em}h2{margin-top:48px;font-size:28px}p{max-width:70ch}header{border-bottom:1px solid var(--line);padding-bottom:24px}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--accent)}figure{margin:24px 0;background:var(--paper);border:1px solid var(--line);padding:20px;overflow:auto}svg{max-width:100%;height:auto}figcaption{font-size:13px;margin-top:16px}button{font:inherit;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 16px;cursor:pointer}button:focus-visible{outline:2px solid #e0914d}pre{overflow:auto;padding:18px;background:var(--paper)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><main><header><span class="eyebrow">REVIEW NOTES</span><h1>替换为这份稿件的具体主题</h1><p>开头给出主要结论，并说明读者为什么需要看这份稿件。</p></header><section><h2>发生了什么变化</h2><p>在这里放完整解释。需要图解时，将 PR Lens 生成的 SVG 直接嵌入 figure。</p></section><section><h2>一个具体例子</h2><p>用真实的输入、处理过程和结果把概念讲清楚。</p></section></main></body></html>
