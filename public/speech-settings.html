<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow"><title>Settings · T-MAX</title>
  <script>try{var t=JSON.parse(localStorage.getItem('tmux-mobile-theme')||'{}').theme;document.documentElement.dataset.theme=t==='kami'?'kami':t==='dark'?'dark':matchMedia('(prefers-color-scheme: dark)').matches?'dark':'kami';}catch{}</script>
  <link rel="stylesheet" href="/reports.css"><link rel="stylesheet" href="/paper-theme.css?v=1">
  <script type="module" src="/speech-settings.js"></script>
  <style>
    main{max-width:580px;margin:auto;padding:32px 24px}fieldset{border:0;padding:0;margin:24px 0}legend{font-size:18px;font-weight:600;margin-bottom:16px}
    .hint{color:var(--muted);font-size:14px;line-height:1.5}label{display:flex;align-items:flex-start;gap:12px;border:1px solid var(--line);border-radius:8px;padding:16px;margin:10px 0;cursor:pointer}label:has(input:checked){border-color:var(--accent)}input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px;flex-shrink:0}strong,small{display:block}small{margin-top:4px;color:var(--muted);line-height:1.5}button{min-height:44px}#status{min-height:24px;margin:12px 0}
  </style>
</head>
<body>
  <header class="topbar"><a href="/command-center" class="back">← Sessions</a><span>T-MAX</span></header>
  <main><h1>Settings</h1><form id="speech-settings"><fieldset><legend>Speech recognition</legend><div id="providers"></div></fieldset>
    <p class="hint">Saved in this browser. Applies to your next recording. The recording status shows the service actually in use.</p>
    <button type="submit">Save</button><p id="status" role="status" aria-live="polite"></p></form>
    <a href="/notification-settings.html">Notification settings</a>
  </main>
</body>
</html>
